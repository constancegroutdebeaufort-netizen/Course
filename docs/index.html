<html lang="fr">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<body>
<title>Objectif 49'59</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* Layout : appli mobile à 3 onglets (Aujourd'hui / Programme / Progrès) avec barre d'onglets en bas. Thème sombre assumé, couleurs d'intensité = zones d'allure. */
:root{
  color-scheme:dark;
  --bg:#0A0E13; --surface:#131A22; --surface2:#1A232D; --ink:#F1F4F7; --muted:#8B98A6; --line:#26313C;
  --accent:#FF5A36;
  --z-rec:#33404D; --z-ef:#3F7FD0; --z-seuil:#E9BC2F; --z-race:#FF9142; --z-fast:#FF4B2B;
  --ok:#43C78A; --slow:#E9BC2F;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabbar:64px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-block:14px calc(var(--tabbar) + 40px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:22px;animation:in .28s ease both}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
.small{font-size:.8rem;color:var(--muted);margin:0}
section{display:flex;flex-direction:column;gap:10px}

/* Barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(10,14,19,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar-in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:640px;gap:6px}
.tab{border:0;background:transparent;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:600}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke:var(--accent)}

/* En-tête Aujourd'hui */
.top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:128px;height:128px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--surface2)}
.ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c b{font-family:var(--display);font-weight:900;font-size:2.9rem;line-height:.85}
.ring-c b small{font-size:.5em;color:var(--accent)}
.ring-c span{font-size:.7rem;color:var(--muted);margin-top:4px}
.top-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.top-txt .big{font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,12vw,3.6rem);line-height:.85;letter-spacing:-.01em}
.top-txt .big em{font-style:normal;color:var(--accent)}
.top-txt .sub{color:var(--muted);font-size:.88rem}
.top-txt .sub b{color:var(--ink);font-weight:600}

/* Météo */
.wx{background:linear-gradient(135deg,#16222E,#121A22);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.wx-t{font-family:var(--display);font-weight:900;font-size:3.2rem;line-height:.85;grid-row:span 2}
.wx-t sup{font-size:.45em;vertical-align:top;position:relative;top:.15em}
.wx-l{font-weight:600}
.wx-s{font-size:.82rem;color:var(--muted)}
.wx-tips{grid-column:1/-1;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.wx-tips b{font-weight:600;color:var(--ink)}
.wx-tips span{color:#C3CDD6}
.wx-where{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--muted);margin-top:4px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:.8rem}

/* Carte séance */
.card{background:var(--surface);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.hero{background:linear-gradient(180deg,#18212B 0%,var(--surface) 55%);border:1px solid var(--line)}
.card.done{opacity:.75}
.card-top{padding:18px 16px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.kind{font-family:var(--display);font-weight:900;font-size:2.3rem;line-height:.9;text-transform:uppercase}
.card.hero .kind{font-size:clamp(2.8rem,13vw,3.6rem)}
.when{font-size:.8rem;color:var(--muted);margin-top:6px}
.badge{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:4px;white-space:nowrap}
.badge.todo{background:var(--accent);color:#0A0E13}
.badge.ok{background:rgba(67,199,138,.15);color:var(--ok)}
.headline{padding:6px 16px 0;font-size:1.02rem}
.profile{padding:14px 16px 4px}
.profile svg{display:block;width:100%;height:68px;overflow:visible}
.card.hero .profile svg{height:92px}
.profile rect{transform-box:fill-box;transform-origin:50% 100%;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.prof-axis{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:4px}
.venue{margin:10px 16px 0;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:8px;padding:3px}
.venue button{border:0;background:transparent;padding:8px;border-radius:6px;font-weight:600;font-size:.88rem;color:var(--muted);transition:background .2s,color .2s}
.venue button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}
.steps{list-style:none;margin:0;padding:12px 16px 4px;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:12px 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.step:first-child{border-top:0}
.step i{width:12px;height:12px;border-radius:3px;margin-top:4px}
.step .main{font-weight:600;min-width:0}
.step .how{font-size:.85rem;color:var(--muted);margin-top:2px;font-weight:400}
.step .big{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1;text-align:right;white-space:nowrap}
.step .big small{display:block;font-family:var(--body);font-weight:500;font-size:.68rem;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.adv{font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-left:6px;font-weight:500;vertical-align:2px}
.note{margin:4px 16px 0;font-size:.84rem;color:var(--z-seuil)}
.foot{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.do{border:0;background:var(--accent);color:#0A0E13;border-radius:10px;padding:16px;font-weight:800;font-size:1.05rem;width:100%;letter-spacing:.01em;transition:transform .12s}
.do:active{transform:scale(.98)}
.card:not(.hero) .do{background:var(--ink);color:var(--bg);padding:13px;font-size:.95rem}
.card.done .do{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500;font-size:.88rem;padding:10px}
.feels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.feels button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:13px 6px;font-weight:700}
.feel-q{font-size:.85rem;color:var(--muted);text-align:center}
.log{display:flex;flex-direction:column;gap:10px}
.log-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.log-grid label{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted)}
.log-grid input{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 8px;font:inherit;font-size:1rem;font-variant-numeric:tabular-nums;width:100%;min-width:0}
.times{display:flex;flex-wrap:wrap;gap:6px}
.tm{border-radius:6px;padding:5px 9px;font-size:.8rem;background:var(--bg);border:1px solid var(--line)}
.tm b{font-family:var(--display);font-weight:800;font-size:1.1rem;margin-right:4px}
.tm.ok{border-color:var(--ok);color:var(--ok)}
.tm.fast{border-color:var(--z-race);color:var(--z-race)}
.tm.slow{border-color:var(--slow);color:var(--slow)}
.verdict{font-size:.88rem;padding:10px 12px;border-radius:8px;background:var(--bg)}
.verdict.good{color:var(--ok)}

/* Flemme + conseil */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:12px;font-weight:600;font-size:.9rem}
.ghost[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:#0A0E13}
.lazy{background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent);animation:in .25s ease both}
.lazy q{font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:1;quotes:none;text-transform:uppercase;text-wrap:balance}
.lazy p{margin:0;color:var(--muted);font-size:.92rem}
.lazy p b{color:var(--ink)}
.tip{display:grid;grid-template-columns:auto 1fr;gap:10px;background:var(--surface);border-radius:12px;padding:12px 14px;font-size:.9rem}
.tip b{font-family:var(--display);font-weight:800;font-size:1rem;text-transform:uppercase;color:var(--z-seuil);letter-spacing:.04em}
.nextup{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:12px 14px}
.nextup b{font-family:var(--display);font-weight:800;font-size:1.25rem;text-transform:uppercase}
.nextup span{font-size:.82rem;color:var(--muted)}

/* Programme */
.weeks{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px}
.wk{background:var(--surface);border:1px solid transparent;border-radius:8px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:background .2s,color .2s}
.wk span{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1}
.wk .dots{display:flex;gap:3px}
.wk .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.wk .dots i.on{background:var(--ok)}
.wk.now{border-color:var(--muted)}
.wk.sel{background:var(--ink);color:var(--bg)}
.wk.sel .dots i{background:#C9D1D9}.wk.sel .dots i.on{background:#1E9A60}
.wk.vac span{font-size:.8rem}
.wk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.wk-head .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.phase{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.plan-line{font-size:.9rem;color:var(--muted)}
.plan-line b{color:var(--ink)}
#weekBox{display:flex;flex-direction:column;gap:12px}
#weekBox.swap{animation:in .25s ease both}
.vac{background:linear-gradient(160deg,#0F3B3A,#142530 70%);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.vac b.t{font-family:var(--display);font-weight:900;font-size:2.6rem;line-height:.9;text-transform:uppercase}
.vac p{margin:0;color:#B9D3D2}
.counter{display:flex;align-items:center;gap:14px}
.counter button{width:44px;height:44px;border-radius:50%;border:1px solid #4F7C7A;background:transparent;font-size:1.3rem;font-weight:700}
.counter b{font-family:var(--display);font-weight:900;font-size:2.4rem;min-width:1.2em;text-align:center}
.planner{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pd{background:var(--surface);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:stretch;gap:5px;text-align:center}
.pd .dn{font-family:var(--display);font-weight:800;font-size:1.05rem}
.pd button{border:1px solid var(--line);background:transparent;border-radius:5px;padding:7px 0;font-size:.74rem;font-weight:600;color:var(--muted)}
.pd button[data-p="bad"][aria-pressed="true"]{background:#7B5CFF;border-color:#7B5CFF;color:#fff}
.pd button[data-p="cf"][aria-pressed="true"]{background:#C9D1D9;border-color:#C9D1D9;color:#0A0E13}
.pd .run{height:30px;border-radius:5px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem;border:1px dashed var(--line);color:var(--line)}
.pd .run.on{border:0;background:var(--accent);color:#0A0E13}
.pd .run.on.b{background:var(--z-ef);color:#fff}
.why{font-size:.88rem;color:var(--muted);margin:0;display:flex;flex-direction:column;gap:4px}
.why b{color:var(--ink)}
.why .warn{color:var(--z-seuil)}
.paces{background:var(--surface);border-radius:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:right;white-space:nowrap}
th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
tbody tr{border-top:1px solid var(--line)}
td .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px}
td.v{font-family:var(--display);font-weight:800;font-size:1.25rem}
tr.goal-row td{color:var(--z-race)}

/* Progrès */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:12px;padding:12px}
.tile b{display:block;font-family:var(--display);font-weight:900;font-size:2.2rem;line-height:1}
.tile span{font-size:.75rem;color:var(--muted)}
.chart{background:var(--surface);border-radius:14px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px}
.chart-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.chart-h b{font-weight:700}
.legend{display:flex;gap:12px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart svg{display:block;width:100%;height:auto}
.chart svg text{fill:var(--muted);font-family:var(--body);font-size:10.5px}
.chart .hit{fill:transparent;cursor:pointer}
.chart .bar{transition:opacity .15s}
.chart svg:hover .bar{opacity:.55}
.chart svg .g:hover .bar{opacity:1}
.readout{min-height:1.3em;font-size:.85rem;color:var(--ink)}
.empty{font-size:.88rem;color:var(--muted);padding:18px 4px;text-align:center}
.splits{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sp{background:var(--surface);border-radius:8px;padding:8px 6px;text-align:center}
.sp span{font-size:.7rem;color:var(--muted)}
.sp b{display:block;font-family:var(--display);font-weight:800;font-size:1.3rem}
.sp.mid{background:var(--z-race);color:#0A0E13}.sp.mid span{color:#0A0E13}
.sp.end{background:var(--accent);color:#0A0E13}.sp.end span{color:#0A0E13}

.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--ok);color:#06150E;padding:12px 18px;border-radius:10px;font-weight:800;max-width:calc(100% - 32px);text-align:center;transition:transform .3s ease,opacity .3s ease;z-index:20;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:19;width:100%;height:100%}
@media (max-width:420px){.weeks{grid-template-columns:repeat(7,minmax(0,1fr))}.ring{width:112px;height:112px}.ring-c b{font-size:2.5rem}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div id="v-aujourdhui" class="view"></div>
  <div id="v-programme" class="view" hidden></div>
  <div id="v-progres" class="view" hidden></div>
  <p class="small" id="syncNote" style="margin-top:18px"></p>
</div>
<nav class="tabbar" aria-label="Navigation">
  <div class="tabbar-in">
    <button class="tab" data-tab="aujourdhui"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Aujourd'hui</button>
    <button class="tab" data-tab="programme"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Programme</button>
    <button class="tab" data-tab="progres"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progrès</button>
  </div>
</nav>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status"></div>

<script>
const RACE=new Date(2027,1,7);
const d=(y,m,dd)=>new Date(y,m-1,dd);
const fmt=s=>{const neg=s<0;s=Math.round(Math.abs(s));return (neg?"−":"")+Math.floor(s/60)+"'"+String(s%60).padStart(2,"0");};
const dstr=dt=>dt.toLocaleDateString("fr-FR",{day:"numeric",month:"short"}).replace(".","");
const kmTxt=k=>String(k).replace(".",",");
const $=s=>document.querySelector(s);
const cap=s=>s.replace(/^./,c=>c.toUpperCase());

/* Étapes : ef {min|km}, int {n,m,p,rec}, run {km|min,p}, acc {n}. adv = ajouté (conseillé, hors programme) */
const WU={k:"ef",min:15,adv:true,lbl:"Échauffement"}, CD={k:"ef",min:10,adv:true,lbl:"Retour au calme"};
const WEEKS=[
 {n:1,phase:"Avant les vacances",start:d(2026,11,16),s:[
  {id:"s1a",kind:"Fractionné",head:"5 × 800 m à 4'40",steps:[{k:"ef",min:10,lbl:"Échauffement"},{k:"int",n:5,m:800,p:280,rec:90},{k:"ef",min:10,lbl:"Retour au calme"}]},
  {id:"s1b",kind:"Footing",head:"8 km tranquille",steps:[{k:"ef",km:8}]}]},
 {n:2,phase:"Avant les vacances",start:d(2026,11,23),s:[
  {id:"s2a",kind:"Fractionné",head:"4 × 1000 m à 4'45",steps:[WU,{k:"int",n:4,m:1000,p:285,rec:90},CD]},
  {id:"s2b",kind:"Footing",head:"9 km tranquille",steps:[{k:"ef",km:9}]}]},
 {n:3,phase:"Avant les vacances",start:d(2026,11,30),s:[
  {id:"s3a",kind:"Fractionné",head:"5 × 1000 m à 4'45",steps:[WU,{k:"int",n:5,m:1000,p:285,rec:90},CD]},
  {id:"s3b",kind:"Footing",head:"10 km tranquille",note:"À caser avant le départ du 4/12.",steps:[{k:"ef",km:10}]}]},
 {n:"R",vac:true,phase:"Vacances",start:d(2026,12,4),end:d(2026,12,12),s:[]},

/* Calculs */
const zone=p=>p<=295?"fast":p<=300?"race":"seuil";
const ZH={rec:.28,ef:.45,seuil:.7,race:.82,fast:1};
const ZC={rec:"var(--z-rec)",ef:"var(--z-ef)",seuil:"var(--z-seuil)",race:"var(--z-race)",fast:"var(--z-fast)"};
function segs(s){const out=[];
  s.steps.forEach(st=>{
    if(st.k==="ef") out.push({z:"ef",sec:st.min?st.min*60:st.km*360});
    else if(st.k==="run") out.push({z:zone(st.p),sec:st.min?st.min*60:st.km*st.p});
    else if(st.k==="int") for(let i=0;i<st.n;i++){out.push({z:zone(st.p),sec:st.m*st.p/1000});if(i<st.n-1)out.push({z:"rec",sec:st.rec});}
    else if(st.k==="acc") for(let i=0;i<st.n;i++){out.push({z:"fast",sec:20});out.push({z:"rec",sec:60});}
  });return out;}
function kmOf(s){return s.steps.reduce((a,st)=>a+(st.k==="ef"?(st.km||st.min/6):st.k==="run"?(st.km||st.min*60/st.p):st.k==="int"?st.n*st.m/1000:0),0);}
function tours(m){const t=m/400,w=Math.floor(t),f=t-w;const fr=f===0?"":f===.5?" ½":f===.25?" ¼":f===.75?" ¾":"";return (w?w:"")+fr+" tour"+(t>1?"s":"");}
function profileSvg(s,tall){
  const sg=segs(s),tot=sg.reduce((a,x)=>a+x.sec,0),W=1000,H=tall?92:68,gap=sg.length>20?3:5;
  let x=0;
  const rects=sg.map((g,i)=>{const w=g.sec/tot*W,h=ZH[g.z]*H;const r=`<rect style="animation-delay:${i*25}ms" x="${(x+gap/2).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${Math.max(1,w-gap).toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${ZC[g.z]}"/>`;x+=w;return r;}).join("");
  return {svg:`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Profil de la séance">${rects}</svg>`,min:Math.round(tot/60)};
}
function stepRows(s,venue){
  const st=venue==="stade";
  return s.steps.map(x=>{let col,main,how,big,bigSub;const adv=x.adv?`<span class="adv">conseillé</span>`:"";
    if(x.k==="ef"){col=ZC.ef;main=(x.lbl||"Footing")+adv;
      if(x.min){big=x.min+"'";bigSub="tranquille";how="Allure EF, tu dois pouvoir parler.";}
      else{big=kmTxt(x.km)+" km";bigSub="5'50–6'15/km";how=st?`≈ ${Math.round(x.km*1000/400)} tours de piste. Le canal est plus agréable pour ça.`:"Allure EF, tu dois pouvoir parler.";}
    }else if(x.k==="int"){col=ZC[zone(x.p)];
      main=`${x.n} × ${x.m>=1000?kmTxt(x.m/1000)+" km":x.m+" m"} à ${fmt(x.p)}/km`;big=fmt(x.m*x.p/1000);bigSub="par répétition";
      how=st?`${tours(x.m)} par répétition, ${fmt(x.p*.4)} par tour. Récup ${fmt(x.rec)} entre chaque.`:`Mesure au GPS, demi-tour pendant la récup. Récup ${fmt(x.rec)} entre chaque.`;
    }else if(x.k==="run"){col=ZC[zone(x.p)];const dist=x.km||x.min*60/x.p;
      main=`${x.lbl||"Bloc"} à ${fmt(x.p)}/km`;big=x.min?x.min+"'":kmTxt(x.km)+" km";bigSub=x.min?"≈ "+kmTxt(dist.toFixed(1))+" km":"en "+fmt(x.km*x.p);
      how=st?`${fmt(x.p*.4)} par tour, ≈ ${Math.round(dist*1000/400)} tours.`:`Règle la montre sur ${fmt(x.p)}/km et tiens-la.`;
    }else if(x.k==="acc"){col=ZC.fast;main=`${x.n} accélérations`;big=x.n+"×";bigSub="progressives";how="Monte en vitesse sur une ligne droite, sans sprinter à fond, puis récupère en marchant.";}
    return `<li class="step"><i style="background:${col}"></i><div class="main">${main}<div class="how">${how}</div></div><div class="big num">${big}<small>${bigSub}</small></div></li>`;}).join("");
}
function mini(s){
  if(s.id==="race") return "Pas de version mini aujourd'hui.";
  if(s.steps.some(x=>x.k==="int"||x.k==="run")) return "<b>Version mini :</b> 15' tranquille puis la moitié des répétitions à la bonne allure. Une séance raccourcie vaut mieux qu'une séance sautée.";
  return "<b>Version mini :</b> 30' tranquille, sans regarder la montre.";
}
function targetsOf(s){
  if(s.id==="race") return [{lbl:"Chrono",t:3000,km:10}];
  const out=[];
  s.steps.forEach(x=>{
    if(x.k==="int") for(let i=0;i<x.n;i++) out.push({lbl:"Rép. "+(i+1),t:x.m*x.p/1000,km:x.m/1000});
    if(x.k==="run") out.push({lbl:(x.lbl||"Bloc")+" /km",t:x.p,km:1});
  });return out;
}
function parseT(str){str=(str||"").trim();if(!str)return null;
  let m=str.match(/^(\d{1,2})\s*['’:.,h ]\s*(\d{1,2})\s*["”]?$/);if(m&&+m[2]<60)return +m[1]*60+ +m[2];
  m=str.match(/^(\d{1,2})(\d{2})$/);if(m&&+m[2]<60)return +m[1]*60+ +m[2];return null;}
const tol=t=>Math.max(3,t/150);
const cls=(v,t)=>{const x=v-t;return Math.abs(x)<=tol(t)?"ok":x<0?"fast":"slow";};
const delta=(v,t)=>{const x=Math.round(v-t);return x===0?"pile":(x>0?"+":"−")+Math.abs(x)+" s";};
/* écart moyen en s/km (négatif = plus rapide) */
function paceDiff(s,v){if(!v?.times)return null;const tg=targetsOf(s);let a=0,n=0;
  v.times.forEach((t,j)=>{if(t!==null&&tg[j]){a+=(t-tg[j].t)/tg[j].km;n++;}});return n?a/n:null;}

/* Planning (0 = lundi) */
const DAYS=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const DAYS_L=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
let plan={bad:[],cf:[]};
function suggest(){
  if(!plan.bad.length&&!plan.cf.length) return null;
  const has=(k,i)=>plan[k].includes((i+7)%7),busy=i=>has("bad",i)||has("cf",i);
  const sA=i=>(busy(i)?-2:3)-(has("cf",i-1)?3:0)-(has("bad",i-1)?1:0)-(has("cf",i+1)?0.5:0);
  const sB=i=>busy(i)?-1:2;
  let best=null;
  for(let a=0;a<7;a++)for(let b=0;b<7;b++){const dist=Math.min(Math.abs(a-b),7-Math.abs(a-b));if(dist<1)continue;
    const sc=sA(a)+sB(b)+(dist>=3?0.3:0)-(dist===1?1:0)-(a>b?0.05:0);if(!best||sc>best.sc)best={a,b,sc};}
  const why=[`<span><b>A, ${DAYS_L[best.a]}</b> : ${busy(best.a)?"jour déjà chargé, fais la course avant l'autre sport":"jour sans autre sport"}${has("cf",best.a-1)?"":", pas de CrossFit la veille"}.</span>`,
    `<span><b>B, ${DAYS_L[best.b]}</b> : ${busy(best.b)?"jour partagé, le footing reste tranquille":"jour sans autre sport"}.</span>`];
  if(has("cf",best.a-1)) why.push(`<span class="warn">Impossible d'éviter le CrossFit la veille de la séance A : ce jour-là, fais plutôt du haut du corps.</span>`);
  return {...best,why};
}

async function initDb(){
  if(!window.claude?.use) return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    const col=db.collection("data/users/"+uid),note=$("#syncNote");
    const t=setTimeout(()=>{note.textContent="Synchronisation lente : tes séances restent enregistrées sur cet appareil.";},10000);
    let first=true;
    col.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(t);note.textContent="Séances synchronisées sur tous tes appareils.";}
      const remote={};let rb=null,rp=null;
      snap.docs.forEach(doc=>{const v=doc.data();if(doc.id==="bonus")rb=v.count||0;else if(doc.id==="planning")rp=v;else if(doc.id.startsWith("sess-"))remote[doc.id.slice(5)]=v;});
      if(first&&snap.empty&&!snap.metadata.fromCache&&(Object.keys(state).length||plan.bad.length||plan.cf.length)){
        Object.entries(state).forEach(([id,v])=>col.doc("sess-"+id).set(v).catch(()=>{}));
        if(bonus) col.doc("bonus").set({count:bonus}).catch(()=>{});
        col.doc("planning").set({bad:plan.bad,cf:plan.cf}).catch(()=>{});
      }else if(!snap.metadata.fromCache||!snap.empty){state=remote;if(rb!==null)bonus=rb;if(rp)plan={bad:rp.bad||[],cf:rp.cf||[]};lsSave();render();}
      first=false;
    },()=>{clearTimeout(t);note.textContent="Synchronisation indisponible : les séances restent sur cet appareil.";});
    store={save(id){lsSave();const v=state[id],r=col.doc("sess-"+id);(v?r.set(v):r.delete()).catch(()=>{});},
      saveBonus(){lsSave();col.doc("bonus").set({count:bonus}).catch(()=>{});},
      savePlan(){lsSave();col.doc("planning").set({bad:plan.bad,cf:plan.cf}).catch(()=>{});}};
  }catch(e){}
}

/* État d'écran */
const T0=(()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());})();
const wEnd=w=>w.end||new Date(w.start.getFullYear(),w.start.getMonth(),w.start.getDate()+(w.endOff||6));
function currentWeekIdx(){let i=WEEKS.findIndex(w=>T0>=w.start&&T0<=wEnd(w));if(i<0)i=T0<WEEKS[0].start?0:WEEKS.length-1;return i;}

function card(s,next,sg,ctx,hero){
  const v=state[s.id],done=!!v?.done,key=ctx+":"+s.id;
  const venue=venues[s.id]||(s.steps.some(x=>x.k==="int")?"stade":"canal");
  const p=profileSvg(s,hero);
  const role=/^s\d+a$/.test(s.id)?"a":/^s\d+b$/.test(s.id)?"b":null;
  const day=s.when||(sg&&role?cap(DAYS_L[sg[role]])+" conseillé":"");
  return `<article class="card ${hero?"hero":""} ${done?"done":""}">
    <div class="card-top"><div><div class="kind">${s.kind}</div><div class="when">${day?day+" · ":""}≈ ${p.min} min · ≈ ${kmTxt(kmOf(s).toFixed(1))} km</div></div>
      ${done?`<span class="badge ok">Fait · ${v.feel||""}</span>`:next&&next.id===s.id&&!hero?`<span class="badge todo">Prochaine</span>`:""}</div>
    <div class="headline">${s.head}</div>
    <div class="profile">${p.svg}<div class="prof-axis"><span>départ</span><span>${p.min} min</span></div></div>
    ${s.note?`<div class="note">${s.note}</div>`:""}
    <div class="venue" role="group" aria-label="Lieu">
      <button data-venue="stade" data-id="${s.id}" aria-pressed="${venue==="stade"}">Au stade</button>
      <button data-venue="canal" data-id="${s.id}" aria-pressed="${venue==="canal"}">Au canal</button></div>
    <ol class="steps">${stepRows(s,venue)}</ol>
    <div class="foot">${done?timesView(s,v):""}
      ${feelOpen===key&&!done?logPanel(s,ctx):`<button class="do" data-do="${s.id}" data-ctx="${ctx}">${done?"Annuler":"C'est fait"}</button>`}</div></article>`;
}
function logPanel(s,ctx){const tg=targetsOf(s);
  return `<div class="log">${tg.length?`<div class="feel-q">Tes temps (facultatif), au format 3'44</div>
    <div class="log-grid">${tg.map((x,j)=>`<label for="t-${ctx}-${s.id}-${j}">${x.lbl}<input id="t-${ctx}-${s.id}-${j}" autocomplete="off" placeholder="${fmt(x.t)}"></label>`).join("")}</div>`:""}
    <div class="feel-q">C'était comment ?</div>
    <div class="feels">${["Facile","Correct","Dur"].map(f=>`<button data-feel="${f}" data-id="${s.id}" data-ctx="${ctx}">${f}</button>`).join("")}</div></div>`;}
function timesView(s,v){if(!v.times)return "";const tg=targetsOf(s);
  const chips=v.times.map((t,j)=>t===null||!tg[j]?"":`<span class="tm ${cls(t,tg[j].t)}"><b class="num">${fmt(t)}</b>${tg[j].lbl} · ${delta(t,tg[j].t)}</span>`).join("");
  let verdict="";
  if(s.id==="s9a"){const got=v.times.filter(x=>x!==null);
    if(got.length===3){const held=got.every((t,j)=>t<=tg[j].t+tol(tg[j].t));
      verdict=held&&v.feel!=="Dur"?`<div class="verdict good">Repère validé : allures tenues sans finir à bloc. Tu es sur la trajectoire du sub 50.</div>`
        :held?`<div class="verdict">Allures tenues, mais c'était dur. Reste sur le plan et pars bien à 5'00 le jour J, pas plus vite.</div>`
        :`<div class="verdict">Allures pas tout à fait tenues. Une séance ne fait pas le résultat : regarde la semaine 10 et la fatigue CrossFit avant de conclure.</div>`;}}
  return `<div class="times">${chips}</div>${verdict}`;}

const WX={0:"Ciel dégagé",1:"Plutôt dégagé",2:"Quelques nuages",3:"Couvert",45:"Brouillard",48:"Brouillard givrant",51:"Bruine légère",53:"Bruine",55:"Bruine forte",56:"Bruine verglaçante",57:"Bruine verglaçante",61:"Pluie faible",63:"Pluie",65:"Pluie forte",66:"Pluie verglaçante",67:"Pluie verglaçante",71:"Neige faible",73:"Neige",75:"Neige forte",77:"Grains de neige",80:"Averses",81:"Averses",82:"Fortes averses",85:"Averses de neige",86:"Averses de neige",95:"Orage",96:"Orage et grêle",99:"Orage et grêle"};
async function loadWx(){
  const lat=wxLoc?.lat??48.86,lon=wxLoc?.lon??2.35;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&hourly=precipitation_probability,apparent_temperature,weather_code&timezone=auto&forecast_days=2`;
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(u,{signal:ctl.signal});if(!r.ok)throw 0;const j=await r.json();
    const now=new Date(j.current.time);const hrs=j.hourly.time.map((t,i)=>({t:new Date(t),p:j.hourly.precipitation_probability[i],a:j.hourly.apparent_temperature[i]}));
    const today=hrs.filter(h=>h.t>=now&&h.t.getDate()===now.getDate()&&h.t.getHours()>=7&&h.t.getHours()<=21);
    const best=today.length?today.reduce((a,b)=>b.p<a.p?b:a):null;
    wx={t:Math.round(j.current.temperature_2m),a:Math.round(j.current.apparent_temperature),code:j.current.weather_code,wind:Math.round(j.current.wind_speed_10m),best,hour:now.getHours()};
    renderToday();
  }catch(e){wx=null;}
}
function wxHtml(){
  if(!wx) return "";
  const c=wx.code,rain=(c>=51&&c<=67)||(c>=80&&c<=82),snow=(c>=71&&c<=77)||c===85||c===86;
  const kit=wx.a>=16?"T-shirt et short.":wx.a>=10?"Manches longues fines, short ou cuissard.":wx.a>=4?"Manches longues, collant, gants fins.":"Deux couches, collant, gants et bonnet.";
  let mood;
  if(c>=95) mood="Orage : on décale. Ton créneau est plus bas.";
  else if(snow) mood="Neige : appuis prudents, fais le fractionné un autre jour si le sol glisse.";
  else if(rain) mood="Pluie : casquette, pas de coton. Et le canal rien que pour toi.";
  else if(wx.wind>=25) mood="Vent : au stade, tu perds dans une ligne droite et tu regagnes dans l'autre. Juge sur l'effort.";
  else if(wx.a<4) mood="Froid : les 10 premières minutes servent à te réchauffer. Ensuite c'est la météo des chronos.";
  else mood="Conditions idéales pour courir vite. Pas d'excuse aujourd'hui.";
  const dark=wx.hour>=16||wx.hour<8?`<span><b>Lumière :</b> il fait nuit tôt, frontale ou gilet réfléchissant au canal.</span>`:"";
  return `<div class="wx">
    <div class="wx-t num">${wx.t}<sup>°</sup></div><div class="wx-l">${WX[c]||"Météo du jour"}</div>
    <div class="wx-s">Ressenti ${wx.a}° · vent ${wx.wind} km/h${wx.best?` · meilleur créneau ${wx.best.t.getHours()}h (${wx.best.p} % de pluie)`:""}</div>
    <div class="wx-tips"><span><b>Tenue :</b> ${kit}</span><span><b>Le mot :</b> ${mood}</span>${dark}</div>
    <div class="wx-where"><span>${wxLoc?"Autour de toi":"Paris"} · Open-Meteo</span><button class="link" id="wxLoc">${wxLoc?"Revenir à Paris":"Utiliser ma position"}</button></div></div>`;
}

/* Vues */
function renderHeaderRing(n){
  const C=2*Math.PI*54,days=Math.max(0,Math.round((RACE-T0)/864e5));
  return `<div class="top"><div class="ring"><svg viewBox="0 0 128 128"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9142"/><stop offset="1" stop-color="#FF4B2B"/></linearGradient></defs>
      <circle class="bgc" cx="64" cy="64" r="54"/><circle class="fg" id="ringFg" cx="64" cy="64" r="54" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"/></svg>
      <div class="ring-c"><b class="num"><small>J-</small>${days}</b><span class="num">${n}/${TOTAL} séances</span></div></div>
    <div class="top-txt"><span class="label">10 km des Champs-Élysées</span><div class="big num">49<em>'</em>59</div><div class="sub">Dimanche <b>7 février</b> · 5'00 au km</div></div></div>`;
}
function renderToday(){
  const el=$("#v-aujourdhui"),n=ALL.filter(s=>state[s.id]?.done).length;
  const next=ALL.find(s=>!state[s.id]?.done),sg=suggest();
  let body="";
  if(!next) body=`<div class="card hero" style="padding:22px"><div class="kind">Programme bouclé</div><p style="color:var(--muted)">24 séances sur 24. Il ne reste qu'à aller chercher ce sub 50.</p></div>`;
  else{
    const w=next.w;let when;
    if(T0<w.start) when=`Première séance de la semaine du ${dstr(w.start)}`;
    else if(T0<=wEnd(w)) when=`Semaine ${w.n} · ${w.phase}`;
    else when=`Semaine ${w.n} · reprends simplement là où tu en es`;
    const after=ALL[ALL.indexOf(next)+1];
    body=`<section><span class="label">Ta séance · ${when}</span>${card(next,next,sg,"t",true)}</section>
      <div class="row2"><button class="ghost" id="lz" aria-expanded="${lazyOpen}">J'ai la flemme</button><button class="ghost" data-goweek="${WEEKS.indexOf(w)}">Voir la semaine</button></div>
      ${lazyOpen?`<div class="lazy"><q>${LAZY[lazyIdx]}</q><p>${mini(next)}</p><button class="link" id="lzm" style="align-self:flex-start">Encore un argument →</button></div>`:""}
      ${TIPS[w.n]?`<div class="tip"><b>Conseil</b><span>${TIPS[w.n]}</span></div>`:""}
      ${after?`<div class="nextup"><div><span>Ensuite</span><br><b>${after.kind}</b></div><span>${after.head}</span></div>`:""}`;
  }
  el.innerHTML=renderHeaderRing(n)+wxHtml()+body;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=$("#ringFg");if(f){const C=2*Math.PI*54;f.style.strokeDashoffset=(C*(1-n/TOTAL)).toFixed(1);}}));
}
function renderPlan(){
  const el=$("#v-programme"),cur=currentWeekIdx(),w=WEEKS[sel],sg=suggest(),next=ALL.find(s=>!state[s.id]?.done);
  let week;
  if(w.vac) week=`<div class="vac"><span class="label" style="color:#8FC1BE">Vacances · 4 au 12 décembre</span><b class="t">La Réunion</b>
      <p>Rien de prévu. Quelques footings faciles sont un bonus, pas une obligation. Une semaine sans courir ne fait pas perdre grand-chose.</p>
      <div class="counter"><button data-bonus="-1" aria-label="Retirer un footing">−</button><b class="num">${bonus}</b><button data-bonus="1" aria-label="Ajouter un footing">+</button><span style="color:#B9D3D2">footing${bonus>1?"s":""} bonus</span></div></div>`;
  else{
    const planLine=w.n===12?`Jours imposés : <b>mardi</b>, <b>jeudi</b>, course <b>dimanche</b>.`:sg?`Avec ta semaine type : séance A <b>${DAYS_L[sg.a]}</b>, séance B <b>${DAYS_L[sg.b]}</b>.`:`Remplis « Ta semaine type » plus bas pour savoir quels jours courir.`;
    week=`<div class="wk-head"><div><div class="phase">${w.phase}${w.tag?" · "+w.tag:""}</div><h2>Semaine ${w.n}</h2><div class="sub">${dstr(w.start)} → ${dstr(wEnd(w))}${sel===cur?" · cette semaine":""}</div></div></div>
      <div class="plan-line">${planLine}</div>
      ${TIPS[w.n]?`<div class="tip"><b>Conseil</b><span>${TIPS[w.n]}</span></div>`:""}
      ${w.s.map(s=>card({...s,w},next,sg,"p",false)).join("")}`;
  }
  el.innerHTML=`<section><h2>Programme</h2>
      <div class="weeks">${WEEKS.map((x,i)=>`<button class="wk ${i===sel?"sel":""} ${i===cur?"now":""} ${x.vac?"vac":""}" data-wk="${i}" aria-label="${x.vac?"Vacances":"Semaine "+x.n}">
        <span>${x.vac?"974":x.n}</span><div class="dots">${x.vac?"<i></i>":x.s.map(s=>`<i class="${state[s.id]?.done?"on":""}"></i>`).join("")}</div></button>`).join("")}</div>
      <p class="small">Touche une semaine pour la voir · point vert = séance faite</p></section>
    <div id="weekBox">${week}</div>
    <section><h2>Ta semaine type</h2>
      <p class="small">Touche Bad ou CF les jours où tu en fais. L'appli place tes deux courses : A = la séance rapide, B = le footing.</p>
      <div class="planner">${DAYS.map((dn,i)=>{const r=sg?(sg.a===i?"A":sg.b===i?"B":""):"";
        return `<div class="pd"><span class="dn">${dn}</span><button data-p="bad" data-d="${i}" aria-pressed="${plan.bad.includes(i)}">Bad</button><button data-p="cf" data-d="${i}" aria-pressed="${plan.cf.includes(i)}">CF</button><div class="run ${r?"on":""} ${r==="B"?"b":""}">${r||"–"}</div></div>`;}).join("")}</div>
      <div class="why">${sg?sg.why.join(""):"<span>Aucun jour indiqué pour l'instant.</span>"}</div></section>
    <section><h2>Tes allures</h2>
      <div class="paces"><table><thead><tr><th>Allure</th><th>Au km</th><th>Tour de stade</th></tr></thead><tbody>
        <tr><td><span class="sw" style="background:var(--z-ef)"></span>Footing (EF)</td><td class="v num">5'50–6'15</td><td class="num">2'20–2'30</td></tr>
        <tr><td><span class="sw" style="background:var(--z-fast)"></span>Fractionné</td><td class="v num">4'40–4'50</td><td class="num">1'52–1'56</td></tr>
        <tr><td><span class="sw" style="background:var(--z-seuil)"></span>Seuil</td><td class="v num">5'05</td><td class="num">2'02</td></tr>
        <tr class="goal-row"><td><span class="sw" style="background:var(--z-race)"></span>Allure course</td><td class="v num">5'00</td><td class="num">2'00</td></tr>
      </tbody></table></div>
      <p class="small">Tour de stade = 400 m dans le couloir 1. Au canal, fie-toi à l'allure au km de ta montre.</p></section>`;
}
function renderProg(){
  const el=$("#v-progres"),doneS=ALL.filter(s=>state[s.id]?.done);
  const km=doneS.reduce((a,s)=>a+kmOf(s),0),timed=ALL.filter(s=>state[s.id]?.times);
  /* Graphique 1 : km par semaine, prévu (contour) vs fait (plein) */
  const wks=WEEKS.filter(w=>!w.vac),W=360,H=170,pl=26,pb=22,pt=10,iw=W-pl-6,ih=H-pb-pt;
  const plannedK=wks.map(w=>w.s.reduce((a,s)=>a+kmOf(s),0)),doneK=wks.map(w=>w.s.filter(s=>state[s.id]?.done).reduce((a,s)=>a+kmOf(s),0));
  const max=Math.ceil(Math.max(...plannedK)/5)*5,bw=iw/wks.length,y=v=>pt+ih-v/max*ih;
  let g1=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Km par semaine">`;
  for(let v=0;v<=max;v+=10) g1+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  wks.forEach((w,i)=>{const x=pl+i*bw+bw*.18,bwi=bw*.64;
    const ph=plannedK[i]/max*ih,dh=doneK[i]/max*ih;
    g1+=`<g class="g" data-tip="Semaine ${w.n} : ${kmTxt(doneK[i].toFixed(1))} km faits sur ${kmTxt(plannedK[i].toFixed(1))} prévus" data-chart="km">
      <rect class="bar" x="${x}" y="${y(plannedK[i])}" width="${bwi}" height="${ph}" rx="4" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="3 3"/>
      ${dh>0?`<rect class="bar" x="${x}" y="${y(doneK[i])}" width="${bwi}" height="${dh}" rx="4" fill="var(--z-ef)"/>`:""}
      <text x="${x+bwi/2}" y="${H-6}" text-anchor="middle">${w.n}</text>
      <rect class="hit" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih+pb}"/></g>`;});
  g1+=`</svg>`;
  /* Graphique 2 : écart moyen à l'allure cible (s/km), barres autour de zéro */
  const pts=timed.map(s=>({s,d:paceDiff(s,state[s.id])})).filter(p=>p.d!==null);
  let g2;
  if(!pts.length) g2=`<div class="empty">Saisis tes temps quand tu coches une séance de fractionné ou d'allure : ta courbe apparaîtra ici.</div>`;
  else{const H2=150,mid=H2/2,lim=Math.max(10,Math.ceil(Math.max(...pts.map(p=>Math.abs(p.d)))/5)*5),sc=v=>v/lim*(mid-18),bw2=Math.min(46,(W-pl-6)/Math.max(pts.length,6));
    g2=`<svg viewBox="0 0 ${W} ${H2}" role="img" aria-label="Écart à l'allure cible">
      <text x="${pl-6}" y="16" text-anchor="end">+${lim}</text><text x="${pl-6}" y="${H2-8}" text-anchor="end">−${lim}</text>
      <line x1="${pl}" x2="${W-6}" y1="${mid}" y2="${mid}" stroke="var(--muted)" stroke-width="1"/>
      <text x="${W-6}" y="14" text-anchor="end">plus rapide ↑</text><text x="${W-6}" y="${H2-6}" text-anchor="end">plus lent ↓</text>`;
    pts.forEach((p,i)=>{const x=pl+8+i*bw2,h=Math.max(2,Math.abs(sc(p.d))),faster=p.d<0;
      const tipTxt=`S${p.s.w.n} · ${p.s.head} : ${Math.abs(Math.round(p.d))===0?"pile sur la cible":Math.abs(Math.round(p.d))+" s/km "+(faster?"plus rapide":"plus lent")+" que la cible"}`;
      g2+=`<g class="g" data-tip="${tipTxt}" data-chart="pace"><rect class="bar" x="${x}" y="${faster?mid-h:mid}" width="${bw2*.7}" height="${h}" rx="4" fill="${Math.abs(p.d)<=2?"var(--ok)":faster?"var(--z-race)":"var(--slow)"}"/>
        <rect class="hit" x="${x-bw2*.15}" y="0" width="${bw2}" height="${H2}"/></g>`;});
    g2+=`</svg>`;}
  el.innerHTML=`<section><h2>Progrès</h2>
      <div class="tiles"><div class="tile"><b class="num">${doneS.length}<span style="font-size:.5em;color:var(--muted)">/${TOTAL}</span></b><span>séances</span></div>
        <div class="tile"><b class="num">${Math.round(km)}</b><span>km courus</span></div>
        <div class="tile"><b class="num">${bonus}</b><span>footings bonus</span></div></div></section>
    <div class="chart"><div class="chart-h"><b>Km par semaine</b><div class="legend"><span><i style="background:var(--z-ef)"></i>fait</span><span><i style="border:1px dashed var(--muted)"></i>prévu</span></div></div>${g1}<div class="readout" id="ro-km">${readout.km||"Touche une barre pour le détail."}</div></div>
    <div class="chart"><div class="chart-h"><b>Écart à l'allure cible</b><span class="small">moyenne par séance, en s/km</span></div>${g2}
      ${pts.length?`<div class="legend"><span><i style="background:var(--ok)"></i>dans la cible</span><span><i style="background:var(--z-race)"></i>plus rapide</span><span><i style="background:var(--slow)"></i>plus lent</span></div><div class="readout" id="ro-pace">${readout.pace||"Touche une barre pour le détail."}</div>`:""}</div>
    <section><h2>Le jour J</h2>
      <div class="splits">${Array.from({length:10},(_,i)=>`<div class="sp ${i===4?"mid":i===9?"end":""}"><span>km ${i+1}</span><b class="num">${fmt((i+1)*300)}</b></div>`).join("")}</div>
      <p class="small">Temps de passage à 5'00/km. Bloqué·e au départ ? Ne rattrape pas d'un coup, étale sur les 9 km restants :</p>
      <div class="paces"><table><thead><tr><th>Perdu au 1er km</th><th>Allure ensuite</th></tr></thead><tbody>
        ${[15,30,45,60].map(l=>`<tr><td class="num">${l} s</td><td class="v num">${fmt((2700-l)/9)}</td></tr>`).join("")}</tbody></table></div></section>`;
}
function render(){renderToday();renderPlan();renderProg();}

/* Onglets */
function showTab(t){tab=["aujourdhui","programme","progres"].includes(t)?t:"aujourdhui";
  document.querySelectorAll(".view").forEach(v=>{v.hidden=v.id!=="v-"+tab;if(!v.hidden){v.style.animation="none";v.offsetHeight;v.style.animation="";}});
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  window.scrollTo(0,0);}
window.addEventListener("hashchange",()=>showTab(location.hash.slice(1)));

/* Interactions (délégation) */
document.addEventListener("click",e=>{
  const b=e.target.closest("button,.g");if(!b)return;
  if(b.dataset.tab){location.hash=b.dataset.tab;showTab(b.dataset.tab);return;}
  if(b.id==="lz"){lazyOpen=!lazyOpen;renderToday();return;}
  if(b.id==="lzm"){lazyIdx=(lazyIdx+1)%LAZY.length;renderToday();return;}
  if(b.id==="wxLoc"){if(wxLoc){wxLoc=null;lsSave();loadWx();return;}
    if(!navigator.geolocation){toast("Position indisponible sur cet appareil.");return;}
    navigator.geolocation.getCurrentPosition(p=>{wxLoc={lat:+p.coords.latitude.toFixed(2),lon:+p.coords.longitude.toFixed(2)};lsSave();loadWx();},()=>toast("Position refusée : météo de Paris."),{timeout:8000});return;}
  if(b.dataset.goweek){sel=+b.dataset.goweek;renderPlan();location.hash="programme";showTab("programme");return;}
  if(b.dataset.wk){sel=+b.dataset.wk;feelOpen=null;renderPlan();const wb=$("#weekBox");wb.classList.add("swap");return;}
  if(b.dataset.venue){venues[b.dataset.id]=b.dataset.venue;lsSave();render();return;}
  if(b.dataset.bonus){bonus=Math.max(0,bonus+ +b.dataset.bonus);store.saveBonus();render();if(+b.dataset.bonus>0)toast("Footing bonus noté.");return;}
  if(b.dataset.p){const k=b.dataset.p,i=+b.dataset.d;plan[k]=plan[k].includes(i)?plan[k].filter(x=>x!==i):[...plan[k],i].sort();store.savePlan();render();return;}
  if(b.dataset.do){const id=b.dataset.do,key=b.dataset.ctx+":"+id;
    if(state[id]?.done){delete state[id];store.save(id);render();return;}
    feelOpen=feelOpen===key?null:key;render();return;}
  if(b.dataset.feel){const id=b.dataset.id,ctx=b.dataset.ctx,s=ALL.find(x=>x.id===id);
    const times=targetsOf(s).map((_,j)=>parseT(document.getElementById(`t-${ctx}-${id}-${j}`)?.value));
    state[id]={done:true,feel:b.dataset.feel,at:new Date().toISOString(),...(times.some(x=>x!==null)?{times}:{})};
    store.save(id);feelOpen=null;lazyOpen=false;render();celebrate();
    if(id==="race"&&times[0]&&times[0]<3000) toast("SUB 50 en "+fmt(times[0])+" !"); else cheer();return;}
  if(b.dataset.tip){readout[b.dataset.chart]=b.dataset.tip;const ro=$("#ro-"+b.dataset.chart);if(ro)ro.textContent=b.dataset.tip;}
});
document.addEventListener("mouseover",e=>{const g=e.target.closest(".g");if(g){const ro=$("#ro-"+g.dataset.chart);if(ro)ro.textContent=g.dataset.tip;}});

function cheer(){const n=ALL.filter(s=>state[s.id]?.done).length,l=TOTAL-n;
  toast(l===0?"Programme bouclé. Va chercher ce sub 50.":l===1?"Il ne reste plus que la course.":`${n}/24. Plus que ${l}.`);}
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2400);}

/* Célébration */
function celebrate(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("#fx"),ctx=c.getContext("2d"),dpr=Math.min(2,devicePixelRatio||1);
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.scale(dpr,dpr);
  const cols=["#FF5A36","#FF9142","#E9BC2F","#3F7FD0","#43C78A","#F1F4F7"];
  const ps=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.62,vx:(Math.random()-.5)*11,vy:-Math.random()*13-5,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*6,vr:(Math.random()-.5)*.4}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/1600;ctx.clearRect(0,0,innerWidth,innerHeight);if(k>=1)return;
    ps.forEach(p=>{p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.globalAlpha=1-k;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();});
    requestAnimationFrame(f);})(t0);
}

render();showTab(location.hash.slice(1));initDb();loadWx();
</script>
